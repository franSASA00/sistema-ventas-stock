<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elegir nueva contrasena · Sistema de Ventas</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5C4C">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--verde-caja-oscuro) 0%, var(--verde-caja) 55%, #14785F 100%);
  }
  .tarjeta {
    background: var(--superficie);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 30px 60px -20px rgba(10, 68, 56, 0.45);
  }
  .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .marca-icono {
    width: 40px; height: 40px; border-radius: 10px; background: var(--verde-caja);
    display: flex; align-items: center; justify-content: center;
    color: white; font-family: var(--f-display); font-weight: 800; font-size: 18px;
  }
  .marca-texto { font-family: var(--f-display); font-weight: 800; font-size: 17px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitulo { color: var(--texto-tenue); font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; }
  .btn-enviar { width: 100%; margin-top: 24px; padding: 14px; background: var(--verde-caja); color: white; font-size: 15px; }
  .btn-enviar:hover { background: var(--verde-caja-oscuro); }
  .volver { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--texto-tenue); }
  .error-msg {
    background: var(--rojo-claro); color: var(--rojo);
    padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-top: 16px; display: none;
  }
  .mensaje-ok {
    background: var(--verde-caja-claro); color: var(--verde-caja-oscuro);
    padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-top: 16px; display: none;
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="marca">
      <div class="marca-icono">$</div>
      <div class="marca-texto">Ventas &amp; Stock</div>
    </div>
    <h1>Elegir nueva contrasena</h1>
    <div class="subtitulo" id="subtitulo">Escribi tu nueva contrasena (minimo 4 caracteres).</div>
    <form id="form-reset">
      <label for="password">Nueva contrasena</label>
      <input id="password" type="password" required minlength="4">
      <label for="password2">Repetir contrasena</label>
      <input id="password2" type="password" required minlength="4">
      <button type="submit" class="btn-enviar">Guardar nueva contrasena</button>
      <div class="error-msg" id="error-msg"></div>
      <div class="mensaje-ok" id="mensaje-ok"></div>
    </form>
    <a href="login.html" class="volver">Volver al login</a>
  </div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('subtitulo').textContent = 'Este link no es valido. Pedi uno nuevo desde la pantalla de login.';
    document.getElementById('form-reset').style.display = 'none';
  }

  document.getElementById('form-reset').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('error-msg');
    const okEl = document.getElementById('mensaje-ok');
    errorEl.style.display = 'none';
    okEl.style.display = 'none';

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    if (password !== password2) {
      errorEl.textContent = 'Las contrasenas no coinciden';
      errorEl.style.display = 'block';
      return;
    }

    try {
      await apiFetch('/auth/resetear-password', {
        method: 'POST',
        body: { token, nueva_password: password },
        auth: false,
      });
      okEl.textContent = 'Contrasena actualizada. Ya podes iniciar sesion.';
      okEl.style.display = 'block';
      document.getElementById('form-reset').style.display = 'none';
    } catch (err) {
      errorEl.textContent = err.message || 'No se pudo actualizar la contrasena';
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
