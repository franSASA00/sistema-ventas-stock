<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Sistema de Ventas</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5C4C">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--verde-caja-oscuro) 0%, var(--verde-caja) 55%, #14785F 100%);
  }
  .tarjeta {
    background: var(--superficie);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 30px 60px -20px rgba(10, 68, 56, 0.45);
  }
  .marca {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .marca-icono {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--verde-caja);
    display: flex; align-items: center; justify-content: center;
    color: white; font-family: var(--f-display); font-weight: 800; font-size: 18px;
  }
  .marca-texto { font-family: var(--f-display); font-weight: 800; font-size: 17px; }
  .marca-sub { font-size: 12px; color: var(--texto-tenue); }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitulo { color: var(--texto-tenue); font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; }
  .btn-ingresar {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: var(--verde-caja);
    color: white;
    font-size: 15px;
  }
  .btn-ingresar:hover { background: var(--verde-caja-oscuro); }
  .error-msg {
    background: var(--rojo-claro);
    color: var(--rojo);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .lista-sucursales { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .btn-sucursal {
    width: 100%;
    padding: 14px;
    text-align: left;
    background: var(--fondo, #f4f4f4);
    border: 1px solid var(--borde, #ddd);
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-sucursal:hover { background: var(--verde-caja); color: white; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="marca">
      <div class="marca-icono">$</div>
      <div>
        <div class="marca-texto">Ventas &amp; Stock</div>
        <div class="marca-sub">Acceso al sistema</div>
      </div>
    </div>

    <div id="panel-login">
      <h1>Iniciar sesion</h1>
      <div class="subtitulo">Ingresa con tu usuario de servidor o de punto de venta.</div>
      <form id="form-login">
        <label for="username">Usuario</label>
        <input id="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Contrasena</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn-ingresar">Ingresar</button>
        <div class="error-msg" id="error-msg"></div>
      </form>
    </div>

    <div id="panel-sucursal" style="display:none;">
      <h1>Elegi tu sucursal</h1>
      <div class="subtitulo">Tu usuario esta asignado a mas de una sucursal.</div>
      <div class="lista-sucursales" id="lista-sucursales"></div>
    </div>
  </div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
<script>
  let loginPendiente = null;

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('error-msg');
    errorEl.style.display = 'none';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
      const data = await login(username, password);
      manejarLogin(data);
    } catch (err) {
      errorEl.textContent = err.message || 'No se pudo iniciar sesion';
      errorEl.style.display = 'block';
    }
  });

  function manejarLogin(data) {
    if (data.rol === 'servidor') {
      Sesion.guardar(data.access_token, data.rol, data.nombre, null);
      window.location.href = 'admin.html';
      return;
    }

    const sucursales = data.sucursales || [];
    if (sucursales.length === 0) {
      const errorEl = document.getElementById('error-msg');
      errorEl.textContent = 'Este usuario no tiene ninguna sucursal asignada. Contacta a un administrador.';
      errorEl.style.display = 'block';
      return;
    }

    if (sucursales.length === 1) {
      Sesion.guardar(data.access_token, data.rol, data.nombre, sucursales[0].id);
      window.location.href = 'pos.html';
      return;
    }

    loginPendiente = data;
    document.getElementById('panel-login').style.display = 'none';
    const panel = document.getElementById('panel-sucursal');
    panel.style.display = 'block';
    const lista = document.getElementById('lista-sucursales');
    lista.innerHTML = sucursales.map((s) =>
      `<button type="button" class="btn-sucursal" data-id="${s.id}">${s.nombre}</button>`
    ).join('');
    lista.querySelectorAll('.btn-sucursal').forEach((btn) => {
      btn.addEventListener('click', () => {
        Sesion.guardar(loginPendiente.access_token, loginPendiente.rol, loginPendiente.nombre, Number(btn.dataset.id));
        window.location.href = 'pos.html';
      });
    });
  }

  if (Sesion.activa()) {
    window.location.href = Sesion.rol() === 'servidor' ? 'admin.html' : 'pos.html';
  }
</script>
</body>
</html>
