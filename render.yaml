services:
  - type: web
    name: ventas-stock-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
databases:
  - name: ventas-stock-db
    plan: free
